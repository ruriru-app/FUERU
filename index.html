<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FUERU 開発確認</title>
  <style>
    :root {
      color-scheme: light;
      --mint: #8ccbc2;
      --mint-dark: #4d9e93;
      --lavender: #b59ad9;
      --ink: #354846;
      --muted: #71827f;
      --line: #d9eae7;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: grid;
      place-items: center;
      padding: calc(env(safe-area-inset-top) + 24px) 18px calc(env(safe-area-inset-bottom) + 24px);
      background: linear-gradient(160deg, #eaf7f5 0%, #f6f1fb 100%);
      color: var(--ink);
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    }
    main {
      width: min(100%, 440px);
      padding: 34px 22px 24px;
      border: 1px solid rgba(255, 255, 255, .85);
      border-radius: 28px;
      background: rgba(255, 255, 255, .9);
      box-shadow: 0 18px 50px rgba(63, 91, 87, .12);
      text-align: center;
    }
    h1 { margin: 0; color: var(--mint-dark); font-size: 42px; letter-spacing: .08em; }
    .lead { margin: 8px 0 26px; color: var(--muted); font-size: 15px; }
    .links { display: grid; gap: 14px; }
    a {
      display: grid;
      gap: 4px;
      padding: 17px 18px;
      border-radius: 18px;
      color: #fff;
      text-decoration: none;
      font-size: 21px;
      font-weight: 800;
      box-shadow: 0 7px 16px rgba(63, 91, 87, .14);
    }
    a:first-child { background: var(--mint-dark); }
    a:last-child { background: var(--lavender); }
    a small { font-size: 12px; font-weight: 600; opacity: .9; }
    footer { margin-top: 23px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>FUERU</h1>
    <p class="lead">スマートフォン確認用</p>
    <nav class="links" aria-label="確認する画面を選択">
      <a href="parent.html">保護者版<small>v0.9.23 Step2</small></a>
      <a href="child.html">子ども版<small>v0.5.15 Step3・おこづかい帳印刷対応</small></a>
    </nav>
    <footer>開発確認ページ</footer>
  </main>
</body>
</html>
